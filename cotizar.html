<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/Website-Project-UEES/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloque Zero | Cotizar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" src="/src/main.js"></script>
  <link rel="stylesheet" href="/src/css/style.css">
</head>

<body>
  <div id="navbar-placeholder"></div>
  
  <main class="page-content">
    <section class="servicios" style="margin-top: 2rem;">
      <h1 style="text-align: center; color: #ffffff;">Cotiza tu Proyecto</h1>
      <p style="text-align: center; color: var(--text-color); margin-bottom: 2rem;">Calcula el costo estimado de tu próximo proyecto al instante con nuestra API.</p>
      
      <div style="max-width: 500px; margin: 0 auto; background-color: var(--card-bg); padding: 2rem; border-radius: 8px; border: 1px solid #30363d;">
        <form id="form-cotizador" class="formulario-base" style="margin: 0;">
          <div class="form-group">
            <label for="tipoProyecto" style="color: var(--text-color); display: block; margin-bottom: 0.5rem;">Tipo de Proyecto</label>
            <select id="tipoProyecto" required style="width: 100%; padding: 0.8rem; background-color: #010409; border: 1px solid #30363d; color: #fff; border-radius: 4px; margin-bottom: 1rem;">
              <option value="" disabled selected>Selecciona una opción...</option>
              <option value="ecommerce">E-Commerce ($500 base)</option>
              <option value="corporativa">Web Corporativa ($300 base)</option>
              <option value="blog">Blog / Noticias ($200 base)</option>
              <option value="landing">Landing Page ($150 base)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="numeroPaginas" style="color: var(--text-color); display: block; margin-bottom: 0.5rem;">Número de Páginas (+$20 c/u)</label>
            <input type="number" id="numeroPaginas" min="0" value="0" required style="width: 100%; padding: 0.8rem; background-color: #010409; border: 1px solid #30363d; color: #fff; border-radius: 4px; margin-bottom: 1rem;">
          </div>

          <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 0.5rem;">
            <input type="checkbox" id="incluyeBaseDatos" style="width: auto; margin: 0;">
            <label for="incluyeBaseDatos" style="color: var(--text-color); margin: 0; cursor: pointer;">Incluir Base de Datos (+$200)</label>
          </div>
          
          <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 0.5rem;">
            <input type="checkbox" id="incluyeSEO" style="width: auto; margin: 0;">
            <label for="incluyeSEO" style="color: var(--text-color); margin: 0; cursor: pointer;">Optimización SEO (+$100)</label>
          </div>
          
          <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem;">
            <input type="checkbox" id="incluyeMantenimiento" style="width: auto; margin: 0;">
            <label for="incluyeMantenimiento" style="color: var(--text-color); margin: 0; cursor: pointer;">Mantenimiento Mensual (+$50)</label>
          </div>

          <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; padding: 1rem;">Calcular Presupuesto</button>
        </form>

        <div id="resultado-cotizacion" style="margin-top: 1.5rem; text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--primary-color); display: none;">
          <!-- Aquí se mostrará el precio -->
        </div>
      </div>
    </section>
  </main>
  
  <div id="footer-placeholder"></div>
  
</body>

</html>
